name: 發文與自動回覆
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
concurrency:
  group: bot
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: 產生圖卡（有需要才跑）
        run: |
          git config user.name "threads-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ "$(python cards.py check)" = "yes" ]; then
            sudo apt-get install -y -qq fonts-noto-cjk > /dev/null
            pip install -q pillow
            python cards.py
            git add -A images drafts
            git commit -m "bot: 產生圖卡" && git pull --rebase && git push && sleep 20
          fi
      - name: 發布到時間的貼文、回覆留言
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python bot.py publish replies
      - name: 存檔
        run: |
          git add -A drafts data
          git diff --cached --quiet || (git commit -m "bot: 發文/回覆 $(TZ=Asia/Taipei date '+%m-%d %H:%M')" && git pull --rebase && git push)
      - name: 等待接下來 25 分鐘內要發的貼文（減少 GitHub 排程延遲）
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          if [ "$(python bot.py wait)" = "yes" ]; then
            git pull --rebase -q
            if [ "$(python cards.py check)" = "yes" ]; then
              sudo apt-get install -y -qq fonts-noto-cjk > /dev/null
              pip install -q pillow
              python cards.py
              git add -A images drafts
              git commit -m "bot: 產生圖卡" -q && git pull --rebase -q && git push -q && sleep 20
            fi
            python bot.py publish
            git add -A drafts data
            git diff --cached --quiet || (git commit -m "bot: 準時發文 $(TZ=Asia/Taipei date '+%m-%d %H:%M')" && git pull --rebase && git push)
          fi
