<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>阿正 Threads 中控台</title>
<style>
:root{
  --bg:#f6f5f2;--card:#ffffff;--ink:#1d1d1b;--ink2:#55534e;--muted:#8a877f;--line:#e4e1da;
  --accent:#1f5f8b;--accent-weak:#e3eef6;--good:#2e7d4f;--good-weak:#e2f2e8;--warn:#a5650a;--warn-weak:#fbf0dc;
  --bad:#b3372f;--bad-weak:#f8e3e1;--bar:#3a78a8;--grid:#ece9e2;
  --r:14px;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141414;--card:#1e1e1d;--ink:#f0eee9;--ink2:#c3c0b8;--muted:#8f8c85;--line:#33322f;
  --accent:#7fb5dc;--accent-weak:#1d3242;--good:#6cc591;--good-weak:#183326;--warn:#e0a54a;--warn-weak:#3a2c14;
  --bad:#ec7b72;--bad-weak:#3d1f1c;--bar:#6fa8d6;--grid:#2b2a28;--shadow:none}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px 0}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.02em}
.sub{color:var(--muted);font-size:12px}
nav{display:flex;gap:4px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav button{flex:none;border:0;background:none;padding:8px 12px;border-bottom:2px solid transparent;color:var(--ink2);cursor:pointer;font-weight:600}
nav button.on{color:var(--accent);border-bottom-color:var(--accent)}
nav .badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;text-align:center}
main{max-width:1100px;margin:0 auto;padding:16px 16px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent-weak);color:var(--accent);font-weight:600}
.chip.good{background:var(--good-weak);color:var(--good)}.chip.warn{background:var(--warn-weak);color:var(--warn)}.chip.bad{background:var(--bad-weak);color:var(--bad)}
.chip.gray{background:var(--grid);color:var(--ink2)}
textarea{width:100%;min-height:220px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);resize:vertical;line-height:1.6}
input[type=text],input[type=password],input[type=datetime-local],select,input[type=number]{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);max-width:100%}
.field{display:flex;flex-direction:column;gap:4px;margin:10px 0}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.ghost{background:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.why{font-size:13px;color:var(--ink2);margin:6px 0 8px}
.count{font-size:12px;color:var(--muted)}.count.over{color:var(--bad);font-weight:700}
.warnbox{font-size:13px;background:var(--warn-weak);color:var(--warn);border-radius:8px;padding:6px 10px;margin-top:8px}
.errbox{font-size:13px;background:var(--bad-weak);color:var(--bad);border-radius:8px;padding:6px 10px;margin-top:8px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.thumb{position:relative;width:72px;height:72px;border-radius:8px;overflow:hidden;background:var(--grid)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:2px;right:2px;border:0;border-radius:50%;width:22px;height:22px;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;line-height:22px;padding:0}
.preview{white-space:pre-wrap;font-size:14px;color:var(--ink2);border-left:3px solid var(--line);padding-left:10px;margin-top:8px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:560px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
h2{font-size:15px;margin:0 0 4px}
h3{font-size:13px;margin:0 0 10px;color:var(--muted);font-weight:600}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--card);font-size:12px;padding:6px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
a{color:var(--accent)}
.empty{color:var(--muted);text-align:center;padding:28px 0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;z-index:20;max-width:90vw}
.toast.on{opacity:1}
.comment{border-bottom:1px solid var(--line);padding:10px 0}
.comment:last-child{border-bottom:0}
.small{font-size:12px;color:var(--muted)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin-top:10px}
.check input{margin-top:4px;width:18px;height:18px}
details summary{cursor:pointer;font-weight:600}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.tbtn{display:flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;cursor:pointer;font-weight:600;text-align:left}
.tbtn.on{border-color:var(--accent);background:var(--accent-weak);color:var(--accent)}
.quick .btn{padding:6px 10px;font-size:13px}
.cardbox{margin-top:10px;border:1px dashed var(--line);border-radius:10px;padding:8px 12px}
input[type=date],input[type=time]{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg)}
.calbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.calttl{display:flex;align-items:center;gap:8px;font-size:17px}
.legend{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--grid)}
.dot.warn{background:var(--warn)}.dot.good{background:var(--good)}.dot.bad{background:var(--bad)}.dot.gray{background:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
@media(max-width:820px){.cal{grid-template-columns:1fr}}
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;min-height:150px}
@media(max-width:820px){.day{min-height:0}}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day.past{opacity:.75}.day.drop{background:var(--accent-weak)}
.dhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink2);margin-bottom:6px}
.addbtn{border:0;background:var(--accent-weak);color:var(--accent);border-radius:8px;width:28px;height:28px;font-size:18px;cursor:pointer;line-height:28px;padding:0}
.ev{border-left:4px solid var(--muted);background:var(--bg);border-radius:8px;padding:6px 8px;margin-bottom:6px;cursor:pointer;font-size:13px}
.ev.warn{border-left-color:var(--warn)}.ev.good{border-left-color:var(--good)}.ev.bad{border-left-color:var(--bad)}.ev.gray{border-left-color:var(--muted);opacity:.85}
.evt{font-weight:700;margin-right:6px;font-variant-numeric:tabular-nums}.evtype{font-size:11px;color:var(--muted)}
.evx{margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nothing{padding:6px 0}
.seg{display:flex;gap:6px;margin-bottom:14px;background:var(--grid);padding:4px;border-radius:12px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:9px;font-weight:700;cursor:pointer;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--accent);box-shadow:var(--shadow)}
.libitem{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px}
.libitem.on{border-color:var(--accent);background:var(--accent-weak)}
.libsave{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.libsave input{flex:1;min-width:200px}
.thumb{width:84px;height:84px}
.thumb .trm{position:absolute;top:2px;right:2px}
.tnum{position:absolute;top:2px;left:2px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;border-radius:6px;padding:0 5px;line-height:18px}
.tmove{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.has-sort .tmove{display:none}
.has-sort .thumb{cursor:grab}.thumb-ghost{opacity:.35}
.has-sort .thumbs .thumb{width:96px;height:96px}
.flash{outline:3px solid var(--bad);border-radius:8px;animation:fl 1s 3}@keyframes fl{50%{outline-color:transparent}}
.pubbox{padding:10px 14px}.pubbox .pr{display:flex;gap:8px;align-items:center;font-size:14px;padding:4px 0;border-top:1px dashed var(--line)}
.pubbox .pr:first-of-type{border-top:0}.pubbox .pr span.t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmove button{position:static;border:0;background:none;color:#fff;font-size:15px;width:30px;height:24px;cursor:pointer;padding:0}
.addimg{width:84px;height:84px}
.slotchip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-variant-numeric:tabular-nums;font-weight:600}
.libtags{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.libtag .lt-open{border:0;background:none;padding:0;cursor:pointer;display:inline-flex;gap:6px;align-items:center;font:inherit;color:inherit}
.libtag .lt-x{border:0;background:var(--grid);border-radius:50%;width:22px;height:22px;cursor:pointer;padding:0;margin-left:2px;color:var(--ink2)}
.libtag .lt-x:hover{background:var(--bad);color:#fff}
.sheet.wide{max-width:760px}
.askbox{z-index:40;align-items:center}
.ev{position:relative}
.evdel{position:absolute;top:4px;right:4px;border:0;background:var(--grid);color:var(--ink2);border-radius:50%;width:22px;height:22px;cursor:pointer;padding:0;line-height:22px;font-size:14px}
.evdel:hover{background:var(--bad);color:#fff}
.evtbtn{border:0;background:none;padding:0;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums;cursor:pointer;color:inherit}
.evtbtn span{font-size:12px;color:var(--muted)}.evtbtn:hover span{color:var(--accent)}
.ev .evx{font-weight:700;-webkit-line-clamp:1;padding-right:20px}
.ev input.evtime{max-width:calc(100% - 26px)!important}
.ev input.evtime{display:block;border:1px solid transparent;background:transparent;font-weight:800;font-variant-numeric:tabular-nums;padding:0 2px;border-radius:6px;width:100%;max-width:130px;margin:0 0 2px -2px;color:inherit;font-size:14px}
.ev input.evtime:hover,.ev input.evtime:focus{border-color:var(--accent);background:var(--card)}
.slotbar{padding:10px 14px}
.liblist{display:flex;flex-direction:column;gap:8px}
.librow{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;background:var(--bg)}
.librow:hover{border-color:var(--accent)}
.lthumb{flex:none;width:64px;height:64px;border-radius:10px;overflow:hidden;background:var(--grid);display:flex;align-items:center;justify-content:center;font-size:26px}
.lthumb img{width:100%;height:100%;object-fit:cover}
.lmain{flex:1;min-width:0}.lname{font-weight:800;font-size:16px}
.lmeta{font-size:12px;color:var(--muted);margin-top:2px}.ltag{background:var(--grid);border-radius:999px;padding:0 6px;color:var(--ink2)}
.lfirst{font-size:13px;color:var(--ink2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lact{display:flex;flex-direction:column;gap:6px;flex:none}.lact .btn{padding:6px 10px;font-size:13px}
.danger-t{color:var(--bad)}
@media(max-width:560px){.lact{flex-direction:row}.librow{flex-wrap:wrap}.lact{width:100%;justify-content:flex-end}}
.slotchip .sedit{background:none;width:20px;color:var(--muted)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.edtitle{font-size:17px;font-weight:800}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.row2{grid-template-columns:1fr}}
.row2 .field{margin:6px 0}
.aibox{margin:8px 0;border:1px dashed var(--accent);border-radius:10px;padding:8px 12px;background:var(--accent-weak)}
.aibox summary{cursor:pointer;font-weight:700;color:var(--accent)}
.aibox textarea{margin-top:8px;background:var(--card)}
.schedbox{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;position:sticky;bottom:-16px;background:var(--card);padding-bottom:12px}
#e-text{min-height:170px}
.libtag{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px}
.libtag span{font-size:12px;color:var(--muted)}
.libtag.on{border-color:var(--accent);background:var(--accent-weak);color:var(--accent)}
.libtag.add{border-style:dashed;color:var(--accent);font-weight:700}
.tagbar{margin-top:6px}.ftag{border:0;background:var(--grid);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:12px;color:var(--ink2)}
.ftag.on{background:var(--accent);color:#fff}
.titlein{font-size:17px;font-weight:700;padding:10px 12px !important}
#w-text{min-height:180px}
.prows{display:flex;flex-direction:column;gap:8px}
.prow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.prow select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.fcbox{border-style:solid;border-color:var(--accent)}
.replybox{border-style:solid;border-color:var(--good)}
.slotchip .sbtn{width:auto;height:auto;border-radius:6px;background:none;font-weight:700;padding:2px 4px}
.slotchip button{border:0;background:var(--grid);border-radius:50%;width:22px;height:22px;cursor:pointer;padding:0}
.cardprev{width:100%;max-width:260px;border-radius:10px;margin-top:8px;display:block;box-shadow:var(--shadow)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.modal{align-items:center}}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
@media(min-width:700px){.sheet{border-radius:16px}}
</style>
</head>
<body>
<header>
  <div class="top">
    <div><h1>阿正 Threads 中控台</h1><div class="sub" id="sync">尚未連線</div></div>
    <button class="btn ghost" id="reload" title="重新整理">↻</button>
  </div>
  <nav id="tabs">
    <button data-t="lib">📁 文案庫</button>
    <button data-t="cal" class="on">📅 排程<span class="badge" id="b-review" hidden></span></button>
    <button data-t="stats">📈 數據</button>
    <button data-t="inbox">💬 留言待回<span class="badge" id="b-inbox" hidden></span></button>
    <button data-t="settings">⚙️ 設定</button>
  </nav>
</header>
<main id="main"></main>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept="image/*" multiple hidden>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const S = { repo: store.get("tb_repo") || "", pat: store.get("tb_pat") || "", tab: "cal", week: null,
  settings:{}, hooks:[], index:{drafts:[]}, stats:{}, inbox:[], listings:[], followers:[], token:{}, drafts:{}, shas:{} };

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),2600); }

// ---------- GitHub API ----------
async function gh(path, opts={}){
  const r = await fetch(`https://api.github.com/repos/${S.repo}${path}`, {...opts, headers:{
    "Authorization":"Bearer "+S.pat, "Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28", ...(opts.headers||{})}});
  if(r.status===404) return null;
  if(!r.ok){ const e=new Error(`GitHub ${r.status}`); e.status=r.status; try{e.body=await r.json();}catch(_){} throw e; }
  return r.status===204 ? {} : r.json();
}
const b64dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,"")), c=>c.charCodeAt(0)));
const b64enc = str => { const b=new TextEncoder().encode(str); let s=""; for(let i=0;i<b.length;i+=0x8000) s+=String.fromCharCode(...b.subarray(i,i+0x8000)); return btoa(s); };
async function getJSON(path, fallback){
  const f = await gh(`/contents/${path}?ref=main&t=${Date.now()}`);
  if(!f) return fallback;
  S.shas[path]=f.sha;
  return JSON.parse(b64dec(f.content));
}
async function putRaw(path, base64, msg, sha){
  const body={message:msg, content:base64, branch:"main"}; if(sha) body.sha=sha;
  const r = await gh(`/contents/${path}`, {method:"PUT", body:JSON.stringify(body)});
  S.shas[path]=r.content.sha; return r;
}
// 讀最新版 → 套用修改 → 寫回；遇到機器人同時寫入就重試
async function updateJSON(path, mutate, msg, fallback){
  for(let i=0;i<3;i++){
    const cur = await getJSON(path, fallback);
    const next = mutate(structuredClone(cur));
    try{ await putRaw(path, b64enc(JSON.stringify(next,null,2)+"\n"), msg, S.shas[path]); return next; }
    catch(e){ if(e.status!==409 && e.status!==422) throw e; }
  }
  throw new Error("存檔衝突，請重新整理");
}
const rawURL = rel => rel.startsWith("http") ? rel : `https://raw.githubusercontent.com/${S.repo}/main/${rel}`;

// ---------- 載入 ----------
async function loadAll(){
  $("#sync").textContent = "同步中…";
  const [settings, hooks, index, stats, inbox, listings, followers, token, library] = await Promise.all([
    getJSON("config/settings.json",{}), getJSON("config/hooks.json",[]), getJSON("data/index.json",{drafts:[]}),
    getJSON("data/stats.json",{}), getJSON("data/inbox.json",[]), getJSON("data/listings.json",[]),
    getJSON("data/followers.json",[]), getJSON("data/token_status.json",{}), getJSON("data/library.json",[])]);
  Object.assign(S,{settings,hooks,index,stats,inbox,listings,followers,token,library:Array.isArray(library)?library:[]});
  const dir = await gh(`/contents/drafts?ref=main&t=${Date.now()}`) || [];
  const known = Object.fromEntries((index.drafts||[]).map(d=>[d.id,d]));
  const want = dir.filter(f=>f.name.endsWith(".json")).map(f=>f.name.replace(".json",""))
    .filter(id => !known[id] || ["pending","approved","failed"].includes(known[id].status));
  S.drafts = {};
  await Promise.all(want.map(async id => { const d = await getJSON(`drafts/${id}.json`); if(d) S.drafts[id]=d; }));
  $("#sync").textContent = `${S.repo} · ${new Date().toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"})} 已同步`;
  render();
}

// ---------- 共用 ----------
const hookName = id => (S.hooks.find(h=>h.id===id)||{}).name || id || "—";

const aiKey = () => store.get("tb_ai_key") || "";
async function askClaude(prompt){
  const key = aiKey();
  if(!key) throw new Error("NO_KEY");
  let last="";
  for(const model of (S.settings.models || ["claude-sonnet-4-5"])){
    const r = await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{
      "x-api-key":key,"anthropic-version":"2023-06-01","content-type":"application/json","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model,max_tokens:2000,system:STYLE,messages:[{role:"user",content:prompt}]})});
    if(r.ok){ const j=await r.json(); return j.content.map(b=>b.text||"").join(""); }
    last = `${r.status} ${(await r.text()).slice(0,160)}`;
    if(r.status===401) throw new Error("API 金鑰無效，請到「設定」重新貼上");
  }
  throw new Error("AI 暫時無法使用："+last);
}

// ---------- 時間工具 ----------
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const isoOf=(date,time)=>fromLocalInput(`${date}T${time}`);
const dayOf=iso=>ymd(new Date(iso));
const timeOf=iso=>{const d=new Date(iso);return `${pad(d.getHours())}:${pad(d.getMinutes())}`;};
function mondayOf(d){ const x=new Date(d); x.setHours(0,0,0,0); const k=(x.getDay()+6)%7; x.setDate(x.getDate()-k); return x; }
function nextFreeSlot(dateStr){
  const slots=S.settings.slots||["08:30","12:30","21:00"];
  const used=new Set(calItems().map(x=>x.publish_at&&dayOf(x.publish_at)+" "+timeOf(x.publish_at)));
  const start=dateStr?new Date(dateStr+"T00:00"):new Date();
  for(let k=0;k<30;k++){ const d=new Date(start); d.setDate(d.getDate()+k);
    for(const s of slots){ const iso=isoOf(ymd(d),s); if(new Date(iso)>new Date(Date.now()+30*60e3) && !used.has(ymd(d)+" "+s)) return {date:ymd(d),time:s}; } }
  return {date:ymd(new Date()),time:"21:00"};
}
function newId(){ const n=new Date(); return `${n.getFullYear()}${pad(n.getMonth()+1)}${pad(n.getDate())}${pad(n.getHours())}${pad(n.getMinutes())}-${Math.random().toString(36).slice(2,5)}`; }

async function saveDraft(d,msg){
  const path=`drafts/${d.id}.json`;
  const saved = await updateJSON(path, cur => {
    const next={...(cur||{}), ...d};
    if(cur && JSON.stringify(cur.card||null)!==JSON.stringify(d.card||null)) next.images=(next.images||[]).filter(x=>!x.startsWith("images/card-"));
    if(cur && cur.status==="posted") next.status="posted";
    return next;
  }, `中控台：${msg} ${d.id}`, null);
  S.drafts[d.id]=saved; return saved;
}
function checkReady(d){
  const max=S.settings.max_chars||500;
  if(!d.text||!d.text.trim()) return "文案是空的";
  if(fullLen(d.text)>max) return `含署名 ${fullLen(d.text)} 字，超過 ${max}`;
  if(/\[待填/.test(d.text)) return "還有 [待填] 沒填完";
  if(d.type==="listing" && !d.commission_signed) return "物件文要先勾「已簽委託」";
  return "";
}

function imgStrip(list,key){

    <button class="btn ghost addimg" data-add="${key}" type="button">＋照片</button></div>`; }
function bindStrip(root, lists, redraw, before){
  root.querySelectorAll("[data-rm]").forEach(b=>{ const [k,i]=b.dataset.rm.split(":"); const L=lists[k]; if(!L) return; b.onclick=()=>{ before&&before(); L.arr.splice(+i,1); redraw(); }; });
  root.querySelectorAll("[data-mv]").forEach(b=>{ const [k,i,dir]=b.dataset.mv.split(":"); const L=lists[k]; if(!L) return; b.onclick=()=>{ before&&before(); const a=L.arr, x=+i, y=x+(+dir); [a[x],a[y]]=[a[y],a[x]]; redraw(); }; });
  root.querySelectorAll("[data-add]").forEach(b=>{ const L=lists[b.dataset.add]; if(!L) return; b.onclick=()=>{ before&&before(); pickImages({id:L.id,images:L.arr}, redraw); }; });
  if(window.Sortable) root.querySelectorAll("[data-strip]").forEach(el=>{ const L=lists[el.dataset.strip]; if(!L) return;
    Sortable.create(el,{animation:150,draggable:".thumb",filter:".trm",preventOnFilter:false,delay:150,delayOnTouchOnly:true,ghostClass:"thumb-ghost",
      onEnd:ev=>{ const a=ev.oldDraggableIndex,b=ev.newDraggableIndex; if(a===b||a==null||b==null) return; before&&before(); const [x]=L.arr.splice(a,1); L.arr.splice(b,0,x); redraw(); } }); });
}

function drawCard(cv, card){
  if(!cv) return; if(!card||!card.title){ cv.style.display="none"; return; } cv.style.display="block";
  const x=cv.getContext("2d"), W=1080, H=1350, M=88, F='"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
  const g=x.createLinearGradient(0,0,0,H); g.addColorStop(0,"#11203a"); g.addColorStop(1,"#1c3458"); x.fillStyle=g; x.fillRect(0,0,W,H);
  const wrap=(t,font,max)=>{ x.font=font; const out=[]; t.split("\n").forEach(p=>{ let cur=""; for(const ch of p){ if(x.measureText(cur+ch).width<=max) cur+=ch; else if("，。、！？」）：；".includes(ch)&&cur.length>1){ out.push(cur.slice(0,-1)); cur=cur.slice(-1)+ch; } else { out.push(cur); cur=ch; } } out.push(cur); }); return out; };
  x.font=`700 34px ${F}`; const lw=x.measureText(card.label||"").width; x.fillStyle="#e9b949"; x.beginPath(); x.roundRect(M,110,lw+48,64,32); x.fill();
  x.fillStyle="#11203a"; x.textBaseline="top"; x.fillText(card.label||"",M+24,120);
  let size=92, lines; do{ lines=wrap(card.title,`900 ${size}px ${F}`,W-2*M); size-=6; }while(lines.length>4&&size>64); size+=6;
  x.font=`900 ${size}px ${F}`; x.fillStyle="#fff"; let y=230; lines.forEach(l=>{ x.fillText(l,M,y); y+=size*1.32; });
  y+=30; x.fillStyle="#e9b949"; x.fillRect(M,y,120,8); y+=70;
  (card.points||[]).slice(0,5).forEach((p,i)=>{ x.font=`900 50px ${F}`; x.fillStyle="#e9b949"; x.fillText(String(i+1).padStart(2,"0"),M,y);
    const pl=wrap(p,`500 50px ${F}`,W-2*M-100); pl.forEach((l,j)=>{ x.fillStyle=j?"#c8d2e1":"#fff"; x.fillText(l,M+100,y+j*70); }); y+=70*pl.length+40; });
  x.fillStyle="#0a1426"; x.fillRect(0,H-150,W,150); x.font=`500 34px ${F}`; x.fillStyle="#c8d2e1"; x.fillText("連續五年千萬經紀人｜阿正",M,H-102);
  x.font=`900 40px ${F}`; x.fillStyle="#e9b949"; const t="LINE @a0110"; x.fillText(t,W-M-x.measureText(t).width,H-106);
}

    const go=async approve=>{ collect(); const pick=rows.filter(r=>r.lib&&r.time);

      toast(`已排好 ${ok} 篇（${date.slice(5).replace("-","/")}）${approve?"，時間到自動發出":"，記得審核"}`);
      box.remove(); S.week=mondayOf(new Date(date+"T12:00")); S.tab="cal"; render(); };

// ---------- ② 週曆排程 ----------
function calItems(){
  const out=[]; const seen=new Set();
  Object.values(S.drafts).forEach(d=>{ if(d.status!=="rejected"&&d.publish_at){ out.push(d); seen.add(d.id); } });
  (S.index.drafts||[]).forEach(d=>{ if(!seen.has(d.id)&&d.status==="posted"&&(d.posted_at||d.publish_at)) out.push({...d,publish_at:d.posted_at||d.publish_at,text:d.first_line}); });
  return out;
}
function evName(x, first){ const e=x.lib_id&&libEntries().find(l=>l.id===x.lib_id); return e?e.name:(first||"").slice(0,20); }
function pubStatus(){
  const now=new Date(), items=calItems();
  const sending=items.filter(x=>x.status==="approved"&&new Date(x.publish_at)<=now).slice(0,5);
  const failed=items.filter(x=>x.status==="failed");
  const posted=(S.index.drafts||[]).filter(d=>d.status==="posted"&&d.posted_at&&now-new Date(d.posted_at)<48*3600e3).sort((a,b)=>b.posted_at.localeCompare(a.posted_at)).slice(0,5);
  const line=x=>esc(((x.text||x.first_line||"").trim().split("\n")[0]).slice(0,40));
  return `<div class="card pubbox"><div class="row" style="justify-content:space-between"><b>📣 發布狀態</b><button class="btn ghost" id="c-refresh" style="padding:4px 10px">↻ 更新</button></div>
    ${sending.map(x=>`<div class="pr"><span class="chip warn">⏳ 發送中</span><span class="t">${line(x)}</span><span class="small">約 1～3 分鐘</span></div>`).join("")}
    ${failed.map(x=>`<div class="pr"><span class="chip bad">❌ 失敗</span><span class="t">${line(x)}</span><button class="btn ghost" data-ev2="${esc(x.id)}" style="padding:4px 10px">看原因</button></div>`).join("")}
    ${posted.map(x=>`<div class="pr"><span class="chip good">✅ 已發布</span><span class="small">${fmtTime(x.posted_at)}</span><span class="t">${line(x)}</span>${x.permalink?`<a class="btn ghost" href="${esc(x.permalink)}" target="_blank" rel="noopener" style="padding:4px 10px">到 Threads 看</a>`:""}</div>`).join("")}
    ${!sending.length&&!failed.length&&!posted.length?`<div class="small" style="margin-top:4px">最近 48 小時沒有發文</div>`:""}</div>`;
}

    return `<div class="day ${k===today?"today":""} ${k<today?"past":""}" data-day="${k}">
      <div class="dhead"><span>週${W2[i]} <b>${d.getMonth()+1}/${d.getDate()}</b></span>${k>=today?`<button class="addbtn" data-add="${k}" title="在這天新增">＋</button>`:""}</div>
      ${list.map(x=>{ const [st,cls]=STATUS[x.status]||["","gray"]; const first=(x.text||"").trim().split("\n")[0];

    </div>`; }).join("")}</div>
  <div class="small" style="margin-top:10px">點 ＋ 選文案庫的文案＋時間就排好；點貼文可以修改、核准；電腦上也可以把貼文拖到別天。</div>`;
  bindSlots($("#main"),"c",t=>editSlot(t, renderCal),renderCal);
  $("#c-refresh").onclick=async()=>{ $("#c-refresh").textContent="更新中…"; try{ await loadAll(); }catch(e){ toast("更新失敗："+e.message); } };
  document.querySelectorAll("[data-ev2]").forEach(b=>b.onclick=()=>{ const d=S.drafts[b.dataset.ev2]; if(d) openEdit("draft", structuredClone(d)); });
  document.querySelectorAll("[data-evdel]").forEach(b=>{ b.onmousedown=e=>e.stopPropagation(); b.onclick=async e=>{ e.stopPropagation(); const d=S.drafts[b.dataset.evdel]; if(!d) return;
    if(!(await ask(`刪除這篇排程？\n${fmtTime(d.publish_at)}　${evName(d,(d.text||"").split("\n")[0])}\n（文案庫裡的文案不受影響）`,"🗑 刪除"))) return;
    try{ await saveDraft({...d,status:"rejected"},"刪除排程"); S.drafts[d.id].status="rejected"; toast("已刪除這篇排程"); renderCal(); }catch(err){ toast("刪除失敗："+err.message); } }; });
  document.querySelectorAll("[data-evt]").forEach(inp=>{ inp.onmousedown=e=>e.stopPropagation();

      try{ await saveDraft(nd,"改時間"); toast(`已改到 ${fmtTime(nd.publish_at)}`); renderCal(); }catch(err){ toast("失敗："+err.message); } }; });

  document.querySelectorAll("[data-add]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); openPick(b.dataset.add); });

    el.ondragstart=e=>e.dataTransfer.setData("text/plain",el.dataset.ev); });

    day.ondragover=e=>{ e.preventDefault(); day.classList.add("drop"); }; day.ondragleave=()=>day.classList.remove("drop");
    day.ondrop=async e=>{ e.preventDefault(); day.classList.remove("drop"); const id=e.dataTransfer.getData("text/plain"); const d=S.drafts[id]; if(!d) return;
      const nd={...d,publish_at:isoOf(day.dataset.day,timeOf(d.publish_at))}; try{ await saveDraft(nd,"改日期"); toast(`改到 ${fmtTime(nd.publish_at)}`); renderCal(); }catch(err){ toast("失敗："+err.message); } }; });
  $("#c-all").onclick=async()=>{ const ok=[],bad=[]; for(const x of pend){ const why=checkReady(x); if(why) bad.push(timeOf(x.publish_at)+" "+why); else ok.push(x); }
    if(!ok.length) return toast("沒有可核准的："+bad.join("；"));
    if(!(await ask(`要核准這週 ${ok.length} 篇嗎？${bad.length?`\n另有 ${bad.length} 篇還要修改，先不核准。`:""}`,"✅ 全部核准"))) return;
    $("#c-all").disabled=true; let n=0;
    for(const x of ok){ try{ await saveDraft({...x,status:"approved",error:"",tries:0,approved_at:new Date().toISOString()},"整週核准"); n++; }catch(e){} }
    toast(`已核准 ${n} 篇${bad.length?`，${bad.length} 篇待修改`:""}`); renderCal(); };
}


let imgTarget=null, imgDone=null;
function pickImages(d, done){ imgTarget=d; imgDone=done; $("#file").value=""; $("#file").click(); }
$("#file").onchange = async e => {
  const files=[...e.target.files]; if(!files.length||!imgTarget) return;
  const d=imgTarget; d.images=d.images||[];
  toast(`上傳 ${files.length} 張照片中…`);
  try{ for(const [i,f] of files.entries()){ const path=`images/${d.id}-${Date.now()}-${i}.jpg`; const b64=await shrink(f); await putRaw(path, b64, `中控台：上傳照片 ${d.id}`); LOCAL_IMG[path]="data:image/jpeg;base64,"+b64; d.images.push(path); }
    toast("照片已上傳"); imgDone&&imgDone(); }
  catch(err){ toast("上傳失敗："+err.message); }
};
function shrink(file){ // 長邊 1440、JPEG，符合 Threads 圖片規格
  return new Promise((res,rej)=>{ const img=new Image(); img.onload=()=>{ const k=Math.min(1,1440/Math.max(img.width,img.height));
    const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",0.86).split(",")[1]); URL.revokeObjectURL(img.src); };
    img.onerror=rej; img.src=URL.createObjectURL(file); });
}
async function dispatch(wf, inputs, msg){
  try{ await gh(`/actions/workflows/${wf}/dispatches`,{method:"POST",body:JSON.stringify({ref:"main",inputs})}); toast(msg); }
  catch(e){ toast("無法啟動（權杖需要 Actions 權限）："+e.message); }
}

  h+=`<div class="card"><h2>發文時段 × 平均觀看</h2><h3>樣本少時僅供參考，至少各時段 3 篇再調整排程</h3><div class="chart" id="c-hours"></div></div>`;

function tokenCard(){
  const t=S.token||{}; if(!t.refreshed_at) return "";
  return `<div class="small" style="text-align:center">Threads 權杖上次續期：${fmtTime(t.refreshed_at)}（有效 ${t.expires_in_days} 天，每週自動續）</div>`;
}
function tipOn(el){ const tip=document.createElement("div"); tip.className="tip"; el.appendChild(tip);
  return { show(x,y,txt){ tip.textContent=txt; tip.style.left=x+"px"; tip.style.top=y+"px"; tip.style.opacity=1; }, hide(){ tip.style.opacity=0; } }; }
function hbar(sel, data, fmt){
  const el=$(sel), W=Math.max(300,el.clientWidth||340), rowH=30, L=96, R=46, H=data.length*rowH+8, max=Math.max(...data.map(d=>d.value),1);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="鉤子分數排行">`;
  data.forEach((d,i)=>{ const y=i*rowH+4, w=Math.max(4,(W-L-R)*d.value/max);
    s+=`<text x="${L-8}" y="${y+18}" text-anchor="end" font-size="13" fill="var(--ink2)">${esc(d.label)}</text>
      <rect x="${L}" y="${y+5}" width="${w}" height="18" rx="4" fill="var(--bar)"/>
      <text x="${L+w+6}" y="${y+18}" font-size="12" fill="var(--muted)">${Math.round(d.value)}</text>
      <rect x="0" y="${y}" width="${W}" height="${rowH}" fill="transparent" data-i="${i}"/>`; });
  el.innerHTML=s+"</svg>"; const t=tipOn(el);
  el.querySelectorAll("[data-i]").forEach(r=>{ r.onmousemove=r.ontouchstart=ev=>{ const b=el.getBoundingClientRect(), d=data[+r.dataset.i];
    const p=ev.touches?ev.touches[0]:ev; t.show(p.clientX-b.left,p.clientY-b.top,fmt(d)); }; r.onmouseleave=t.hide; });
}
function vbar(sel, data, fmt){
  if(!data.length){ $(sel).innerHTML='<div class="empty">尚無資料</div>'; return; }
  const el=$(sel), W=Math.max(300,el.clientWidth||340), H=180, B=24, T=10, max=Math.max(...data.map(d=>d.value),1), bw=(W-20)/data.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="時段平均觀看"><line x1="0" x2="${W}" y1="${H-B}" y2="${H-B}" stroke="var(--grid)"/>`;
  data.forEach((d,i)=>{ const h=Math.max(4,(H-B-T)*d.value/max), x=10+i*bw+bw*0.2;
    s+=`<rect x="${x}" y="${H-B-h}" width="${bw*0.6}" height="${h}" rx="4" fill="var(--bar)"/>
      <text x="${x+bw*0.3}" y="${H-6}" text-anchor="middle" font-size="12" fill="var(--muted)">${esc(d.label)}</text>
      <rect x="${10+i*bw}" y="0" width="${bw}" height="${H}" fill="transparent" data-i="${i}"/>`; });
  el.innerHTML=s+"</svg>"; const t=tipOn(el);
  el.querySelectorAll("[data-i]").forEach(r=>{ r.onmousemove=r.ontouchstart=ev=>{ const b=el.getBoundingClientRect(), d=data[+r.dataset.i];
    const p=ev.touches?ev.touches[0]:ev; t.show(p.clientX-b.left,p.clientY-b.top,fmt(d)); }; r.onmouseleave=t.hide; });
}
function line(sel, data){
  const el=$(sel), W=Math.max(300,el.clientWidth||340), H=200, L=44, R=12, T=12, B=22, max=Math.max(...data.map(d=>d.value),1)*1.1;
  const x=i=>L+(data.length<2?0:(W-L-R)*i/(data.length-1)), y=v=>T+(H-T-B)*(1-v/max);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="每篇觀看數">`;
  for(let g=0;g<=3;g++){ const v=max*g/3; s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${Math.round(v)}</text>`; }
  s+=`<polyline fill="none" stroke="var(--bar)" stroke-width="2" stroke-linejoin="round" points="${data.map((d,i)=>`${x(i)},${y(d.value)}`).join(" ")}"/>`;
  data.forEach((d,i)=>{ s+=`<circle cx="${x(i)}" cy="${y(d.value)}" r="4" fill="var(--bar)" stroke="var(--card)" stroke-width="2"/>`; });
  s+=`<line id="xh" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--muted)" stroke-dasharray="3 3" opacity="0"/><rect x="${L}" y="0" width="${W-L-R}" height="${H}" fill="transparent" id="hit"/>`;
  el.innerHTML=s+"</svg>"; const t=tipOn(el), svg=el.querySelector("svg"), xh=el.querySelector("#xh");
  const move=ev=>{ const p=ev.touches?ev.touches[0]:ev, b=svg.getBoundingClientRect(); const vx=(p.clientX-b.left)/b.width*W;
    const i=Math.max(0,Math.min(data.length-1,Math.round((vx-L)/((W-L-R)/Math.max(1,data.length-1))))); const d=data[i];
    xh.setAttribute("x1",x(i)); xh.setAttribute("x2",x(i)); xh.setAttribute("opacity",1);
    t.show(x(i)/W*b.width, y(d.value)/H*b.height, `${d.label}｜觀看 ${d.value.toLocaleString()}｜${d.text.slice(0,16)}`); };
  const hit=el.querySelector("#hit"); hit.onmousemove=move; hit.ontouchmove=hit.ontouchstart=move; hit.onmouseleave=()=>{t.hide(); xh.setAttribute("opacity",0);};
}

// ---------- 留言待回 ----------
function renderInbox(){
  const items=S.inbox.filter(x=>!x.handled).slice().reverse();
  let h=`<div class="card"><h2>需要你親自回的留言</h2><h3>問價、問地點、約看屋這類留言機器人已自動回覆並導 LINE。這裡是它判斷不了的，真人回比較好。</h3>`;
  h+= items.length ? items.map(x=>`<div class="comment"><div><b>@${esc(x.username)}</b>：${esc(x.text)}</div>
      <div class="small">在「${esc(x.post_first_line)}」 · ${fmtTime(x.timestamp)}</div>
      <div class="btns"><a class="btn primary" href="${esc(x.permalink||"https://www.threads.net")}" target="_blank" rel="noopener">到 Threads 回覆</a>
      <button class="btn" data-done="${esc(x.id)}">已處理</button></div></div>`).join("") : `<div class="empty">都回完了 👍</div>`;
  $("#main").innerHTML=h+"</div>";
  document.querySelectorAll("[data-done]").forEach(b=>b.onclick=async()=>{ b.disabled=true;
    try{ S.inbox=await updateJSON("data/inbox.json", arr=>arr.map(x=>x.id===b.dataset.done?{...x,handled:true}:x), "中控台：留言已處理", []); render(); }
    catch(e){ toast("失敗："+e.message); b.disabled=false; } });
}

// ---------- 設定 ----------
function renderSettings(){
  const s=S.settings;
  $("#main").innerHTML=`<div class="card"><h2>發文設定</h2>
    <div class="field"><label>每篇自動加的署名（法規要求註明經紀業名稱）</label><input type="text" id="s-footer" value="${esc(s.brand_footer)}"></div>
    <div class="field"><label>每天產幾篇草稿</label><input type="number" id="s-n" min="1" max="10" value="${s.drafts_per_day||3}"></div>
    <div class="field"><label>話題標籤（逗號分隔）</label><input type="text" id="s-tags" value="${esc((s.topic_tags||[]).join(", "))}"></div>
    <div class="field"><label>熱門話題追蹤關鍵字（逗號分隔，最多 10 個）</label><input type="text" id="s-kw" value="${esc((s.search_keywords||[]).join(", "))}"></div>
    <label class="check"><input type="checkbox" id="s-reply" ${s.reply?.enabled!==false?"checked":""}><span>自動回覆留言（有設定「留言自動回覆」的貼文用你的預設資料回；其他貼文問價、地點、看屋、貸款等導 LINE ${esc(s.line_id)}）</span></label>
    <div class="btns"><button class="btn primary" id="s-save">儲存設定</button></div></div>
    <div class="card"><h2>📝 預設自己留言</h2><h3>每篇發文後，機器人用你的帳號在自己貼文底下留這段。每篇也可以在編輯畫面另外改，或關掉。</h3>
      <label class="check"><input type="checkbox" id="s-fcon" ${(s.first_comment||{}).enabled?"checked":""}><span>每篇發文後都自動留言</span></label>
      <div class="field"><label>預設留言內容（{line} 換成 LINE ID，{link} 換成下面連結）</label><textarea id="s-fctext" style="min-height:90px" placeholder="例：想看更多台中好房、免費估價，LINE {line} 找阿正">${esc((s.first_comment||{}).text||"")}</textarea></div>
      <div class="field"><label>預設連結（可空白）</label><input type="text" id="s-fclink" value="${esc((s.first_comment||{}).link||"")}" placeholder="https://"></div>
      <div class="btns"><button class="btn primary" id="s-fcsave">儲存預設留言</button></div></div>
    <div class="card"><h2>AI 寫文案金鑰</h2><h3>Claude API 金鑰（sk-ant- 開頭），只存在這台裝置的瀏覽器，不會上傳。有了它，「寫文案」和週曆裡的 AI 按鈕才能用。</h3>
      <div class="row"><input type="password" id="s-ai" placeholder="sk-ant-…" style="flex:1" value="${aiKey()?"••••••••（已設定）":""}"><button class="btn primary" id="s-ai-save">儲存</button><button class="btn ghost" id="s-ai-del">清除</button></div></div>
    <div class="card"><h2>手動執行</h2><div class="btns">
      <button class="btn" id="run-pub">立刻檢查發文與留言</button></div></div>
    <div class="card"><h2>連線</h2><div class="small">儲存庫：${esc(S.repo)}</div>
      <div class="btns"><button class="btn ghost" id="logout">登出這台手機</button></div></div>`;
  const list=v=>v.split(/[,，]/).map(x=>x.trim()).filter(Boolean);
  $("#s-save").onclick=async()=>{ try{ S.settings=await updateJSON("config/settings.json", cur=>({...cur, brand_footer:$("#s-footer").value.trim(),
      drafts_per_day:+$("#s-n").value||3, topic_tags:list($("#s-tags").value), search_keywords:list($("#s-kw").value).slice(0,10),
      reply:{...(cur.reply||{}), enabled:$("#s-reply").checked}}), "中控台：更新設定", {}); toast("設定已儲存"); }catch(e){ toast("儲存失敗："+e.message); } };
  $("#s-fcsave").onclick=async()=>{ try{ S.settings=await updateJSON("config/settings.json", cur=>({...cur, first_comment:{...(cur.first_comment||{}), enabled:$("#s-fcon").checked, text:$("#s-fctext").value.trim(), link:$("#s-fclink").value.trim()}}), "中控台：預設自己留言", {}); toast("預設留言已儲存"); }catch(e){ toast("儲存失敗："+e.message); } };
  $("#run-pub").onclick=()=>dispatch("publish.yml",undefined,"已啟動，約 1 分鐘");
  $("#s-ai-save").onclick=()=>{ const v=$("#s-ai").value.trim(); if(!v.startsWith("sk-")) return toast("金鑰應該是 sk-ant- 開頭"); store.set("tb_ai_key",v); toast("AI 金鑰已儲存在這台裝置"); renderSettings(); };
  $("#s-ai-del").onclick=()=>{ store.del("tb_ai_key"); toast("已清除"); renderSettings(); };
  $("#logout").onclick=()=>{ store.del("tb_pat"); location.reload(); };
}

// ---------- 登入 ----------
function renderLogin(err){
  $("#main").innerHTML=`<div class="card"><h2>第一次使用</h2><h3>權杖只存在這支手機的瀏覽器裡，不會上傳。</h3>
    ${err?`<div class="errbox">${esc(err)}</div>`:""}
    <div class="field"><label>GitHub 儲存庫（帳號/名稱）</label><input type="text" id="l-repo" placeholder="gary19940110/threads-bot" value="${esc(S.repo)}"></div>
    <div class="field"><label>GitHub 權杖（Fine-grained token）</label><input type="password" id="l-pat" placeholder="github_pat_…"></div>
    <div class="btns"><button class="btn primary" id="l-go">連線</button></div></div>`;
  $("#l-go").onclick=async()=>{ S.repo=$("#l-repo").value.trim(); S.pat=$("#l-pat").value.trim();
    try{ await gh(""); store.set("tb_repo",S.repo); store.set("tb_pat",S.pat); await loadAll(); }
    catch(e){ renderLogin("連不上："+e.message+"（檢查儲存庫名稱與權杖權限）"); } };
}

$("#tabs").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; S.tab=b.dataset.t; if(S.pat) render(); };
$("#reload").onclick=()=>S.pat?loadAll().catch(e=>toast(e.message)):null;
if(S.repo && S.pat) loadAll().catch(e=>renderLogin("連線失敗："+e.message)); else renderLogin();
</script>
</body>
